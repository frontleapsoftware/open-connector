name: Build runtime package

# Builds the headless embeddable package (`npm run build:runtime`), verifies it,
# uploads a `.tgz` artifact, and publishes it to GitHub Packages (not npmjs).
#
# Automatic: every push to `main` publishes
#   @<owner>/open-connector@0.0.<run_number>
# Manual / reusable: workflow_dispatch and workflow_call accept optional
# `package_name` and `version` overrides.
#
# Install in another repo (e.g. Frontleap monorepo):
#
#   # .npmrc
#   @frontleapsoftware:registry=https://npm.pkg.github.com
#   //npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}
#
#   npm install @frontleapsoftware/open-connector
#
# The package scope must match the GitHub owner (GitHub Packages requirement).
# Default name is @${{ github.repository_owner }}/open-connector.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_name:
        description: "Optional package name (must use @<github-owner>/...). Empty = @<owner>/open-connector"
        required: false
        type: string
        default: ""
      version:
        description: "Optional version. Empty = 0.0.<run_number>"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      package_name:
        description: "Optional package name (must use @<github-owner>/...)"
        required: false
        type: string
        default: ""
      version:
        description: "Optional version. Empty = 0.0.<run_number>"
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: "Name of the uploaded tarball artifact"
        value: ${{ jobs.package.outputs.artifact_name }}
      package_name:
        description: "Published package name"
        value: ${{ jobs.package.outputs.package_name }}
      package_version:
        description: "Published package version"
        value: ${{ jobs.package.outputs.package_version }}

permissions:
  contents: read

concurrency:
  group: build-runtime-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_name: headless-package
      package_name: ${{ steps.meta.outputs.package_name }}
      package_version: ${{ steps.meta.outputs.package_version }}
      tarball_name: ${{ steps.meta.outputs.tarball_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci

      - name: Resolve package name and version
        id: meta
        env:
          INPUT_PACKAGE_NAME: ${{ inputs.package_name || '' }}
          INPUT_VERSION: ${{ inputs.version || '' }}
          OWNER: ${{ github.repository_owner }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          default_name="@${OWNER}/open-connector"
          name="${INPUT_PACKAGE_NAME:-$default_name}"
          version="${INPUT_VERSION:-0.0.${RUN_NUMBER}}"
          case "$name" in
            "@${OWNER}/"*) ;;
            *)
              echo "::error::package_name must be scoped to @${OWNER}/ (GitHub Packages). Got: ${name}"
              exit 1
              ;;
          esac
          npm pkg set "name=${name}"
          npm pkg set "version=${version}"
          # Safe filename fragment for logs (scope slash → dash).
          tarball_stem=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).name.replace(/^@/,"").replace("/","-")')
          echo "package_name=${name}" >> "$GITHUB_OUTPUT"
          echo "package_version=${version}" >> "$GITHUB_OUTPUT"
          echo "tarball_name=${tarball_stem}-${version}.tgz" >> "$GITHUB_OUTPUT"
          echo "Resolved ${name}@${version}"

      - run: npm run build:runtime

      - name: Set package repository and publishConfig
        run: |
          npm pkg set --prefix dist/package \
            repository.type=git \
            "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" \
            "publishConfig.registry=https://npm.pkg.github.com"

      - name: Pack
        run: |
          mkdir -p dist/release
          npm pack ./dist/package --pack-destination dist/release
          ls -la dist/release

      - name: Verify installation and startup
        env:
          CONNECTOR_PACKAGE_NAME: ${{ steps.meta.outputs.package_name }}
        run: |
          npm install --prefix "$RUNNER_TEMP/consumer" --no-audit --no-fund "$PWD"/dist/release/*.tgz
          cd "$RUNNER_TEMP/consumer"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const { createConnectorRuntime } = await import(process.env.CONNECTOR_PACKAGE_NAME);
          const connector = await createConnectorRuntime({
            dataDir: "./data",
            publicOrigin: "https://host.example",
          });
          const request = (path) => connector.fetch(new Request("https://host.example" + path));
          try {
            assert.equal((await request("/v1/health")).status, 200);
            assert.match(await (await request("/v1/providers")).text(), /"github"/);
            assert.equal((await request("/")).status, 404);
          } finally {
            await connector.close();
          }
          JS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-package
          path: dist/release/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to GitHub Packages
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@${{ github.repository_owner }}"
          package-manager-cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: headless-package
          path: dist/release

      - name: Publish (skip if version already exists)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ needs.package.outputs.package_name }}
          PACKAGE_VERSION: ${{ needs.package.outputs.package_version }}
        run: |
          set -euo pipefail
          tarball=$(ls dist/release/*.tgz)
          spec="${PACKAGE_NAME}@${PACKAGE_VERSION}"
          if npm view "$spec" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Skipping ${spec}: already on GitHub Packages."
            exit 0
          fi
          npm publish "$tarball" --registry=https://npm.pkg.github.com
          echo "Published ${spec} to GitHub Packages."
