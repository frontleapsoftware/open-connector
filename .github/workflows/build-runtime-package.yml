name: Build runtime package

# Builds the headless embeddable package (`npm run build:runtime`), packs a
# tarball, verifies it boots in a scratch consumer, and uploads the `.tgz` as a
# workflow artifact. Does not publish to npm.
#
# Use this when integrating the runtime into another repo (for example a
# Frontleap monorepo) before wiring a private registry publish:
#
#   Actions > Build runtime package > Run workflow
#   → download the `headless-package` artifact
#   → npm install ./oomol-lab-open-connector-*.tgz  (or your renamed name)
#
#   workflow_dispatch / workflow_call inputs:
#     package_name — optional npm name written into the packed package.json
#     version      — optional version (defaults to package.json / 0.0.0-development)
on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Optional package name for the tarball, e.g. @frontleap/open-connector"
        required: false
        type: string
        default: ""
      version:
        description: "Optional package version, e.g. 0.1.0. Leave empty to keep package.json."
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      package_name:
        description: "Optional package name for the tarball"
        required: false
        type: string
        default: ""
      version:
        description: "Optional package version"
        required: false
        type: string
        default: ""
    outputs:
      artifact_name:
        description: "Name of the uploaded tarball artifact"
        value: headless-package

permissions:
  contents: read

concurrency:
  group: build-runtime-package-${{ github.workflow }}-${{ github.ref }}-${{ inputs.package_name || 'default' }}-${{ inputs.version || 'dev' }}
  cancel-in-progress: true

jobs:
  package:
    name: Build and verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci

      - name: Set package name
        if: inputs.package_name != ''
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: npm pkg set "name=${PACKAGE_NAME}"

      - name: Set package version
        if: inputs.version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: npm pkg set "version=${PACKAGE_VERSION}"

      - run: npm run build:runtime

      - name: Set package repository metadata
        run: npm pkg set --prefix dist/package repository.type=git "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Pack
        run: |
          mkdir -p dist/release
          npm pack ./dist/package --pack-destination dist/release
          ls -la dist/release

      - name: Verify installation and startup
        run: |
          CONNECTOR_PACKAGE_NAME=$(node -p 'require("./dist/package/package.json").name')
          export CONNECTOR_PACKAGE_NAME
          npm install --prefix "$RUNNER_TEMP/consumer" --no-audit --no-fund "$PWD"/dist/release/*.tgz
          cd "$RUNNER_TEMP/consumer"
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          const { createConnectorRuntime } = await import(process.env.CONNECTOR_PACKAGE_NAME);
          const connector = await createConnectorRuntime({
            dataDir: "./data",
            publicOrigin: "https://host.example",
          });
          const request = (path) => connector.fetch(new Request("https://host.example" + path));
          try {
            assert.equal((await request("/v1/health")).status, 200);
            assert.match(await (await request("/v1/providers")).text(), /"github"/);
            assert.equal((await request("/")).status, 404);
          } finally {
            await connector.close();
          }
          JS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-package
          path: dist/release/*.tgz
          if-no-files-found: error
          retention-days: 14
