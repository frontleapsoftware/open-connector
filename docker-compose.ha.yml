# HA overlay: Postgres + MinIO + Redis for multi-replica OpenConnector.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up --build
# Scale connectors after backends are healthy:
#   docker compose -f docker-compose.yml -f docker-compose.ha.yml up --scale connector=2

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: connect
      POSTGRES_PASSWORD: connect
      POSTGRES_DB: connect
    ports:
      - "5432:5432"
    volumes:
      - ha-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connect -d connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ha-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done
        mc mb --ignore-existing local/open-connector-transit
        exit 0

  connector:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      OOMOL_CONNECT_DATABASE_URL: postgres://connect:connect@postgres:5432/connect
      OOMOL_CONNECT_REDIS_URL: redis://redis:6379
      OOMOL_CONNECT_ENCRYPTION_KEY: local-ha-dev-encryption-key-change-me
      OOMOL_CONNECT_TRANSIT_FILE_BACKEND: s3
      OOMOL_CONNECT_S3_BUCKET: open-connector-transit
      OOMOL_CONNECT_S3_ENDPOINT: http://minio:9000
      OOMOL_CONNECT_S3_REGION: us-east-1
      OOMOL_CONNECT_S3_ACCESS_KEY_ID: minioadmin
      OOMOL_CONNECT_S3_SECRET_ACCESS_KEY: minioadmin
      OOMOL_CONNECT_S3_FORCE_PATH_STYLE: "true"
      OOMOL_CONNECT_ORIGIN: http://localhost:3000
    volumes: !reset []

volumes:
  ha-postgres:
  ha-minio:
